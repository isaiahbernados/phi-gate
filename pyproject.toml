[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-gate"
version = "0.1.0"
description = "Boolean PHI screening through configurable System One models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
phi-gate = "phi_gate:main"

[tool.setuptools]
py-modules = ["phi_gate"]
